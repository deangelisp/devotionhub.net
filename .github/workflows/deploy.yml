name: deploy

# Deploys the devotion theme to Hostinger when it changes on main.
# Only the theme folder is sent: WordPress, plugins and uploads are managed on the server.
# Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'web/app/themes/devotion/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      # Absolute path of the devotion theme folder on the server.
      THEME_PATH: ${{ vars.THEME_PATH }}

    defaults:
      run:
        working-directory: web/app/themes/devotion

    steps:
      - name: Check variables
        working-directory: .
        run: |
          if [ -z "$THEME_PATH" ]; then
            echo "::error::Set the THEME_PATH repository variable to the theme folder on the server."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/app/themes/devotion/package-lock.json

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      # Refuse to sync with --delete into a folder that isn't already the theme.
      - name: Check theme folder on server
        run: ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" test -f "$THEME_PATH/style.css"

      - name: Upload theme
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            --exclude='/node_modules' \
            --exclude='/storage' \
            --exclude='/.vscode' \
            --exclude='/.budfiles' \
            ./ "$SSH_USER@$SSH_HOST:$THEME_PATH/"

      # Compiled Blade views and Acorn's package cache are rebuilt on the next request.
      - name: Clear theme caches
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -se <<EOF
          set -e
          cd "$THEME_PATH"
          mkdir -p storage/framework/cache storage/framework/views
          rm -f storage/framework/cache/*.php storage/framework/views/*.php
          EOF
